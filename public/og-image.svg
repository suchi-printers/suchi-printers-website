<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210" />
      <stop offset="50%" stop-color="#1E1B18" />
      <stop offset="100%" stop-color="#0F0E0D" />
    </linearGradient>
    <pattern id="kraft-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A67C52" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#kraft-grid)" />

  <!-- Shipping Tape Accents -->
  <rect x="0" y="0" width="1200" height="10" fill="#A67C52" />
  <rect x="0" y="620" width="1200" height="10" fill="#A67C52" />

  <!-- Box Logo Emblem -->
  <rect x="100" y="110" width="100" height="100" rx="16" fill="#6B4423" stroke="#A67C52" stroke-width="4" />
  <text x="150" y="175" font-family="sans-serif" font-weight="900" font-size="52" fill="#F5EBDD" text-anchor="middle">SP</text>

  <!-- Brand Title -->
  <text x="230" y="155" font-family="sans-serif" font-weight="900" font-size="54" fill="#F5EBDD" letter-spacing="2">SUCHI PRINTERS</text>
  <text x="235" y="195" font-family="monospace" font-size="20" fill="#E8A33D" letter-spacing="4">ESTD. 1995 • FAZALGANJ, KANPUR</text>

  <!-- Main Headline -->
  <text x="100" y="320" font-family="sans-serif" font-weight="900" font-size="64" fill="#F5EBDD">PACKAGING THAT</text>
  <text x="100" y="390" font-family="sans-serif" font-weight="900" font-size="64" fill="#E8A33D">CARRIES YOUR BRAND.</text>

  <!-- Subheadline -->
  <text x="100" y="455" font-family="sans-serif" font-size="24" fill="#D8BE9F">Corrugated Cartons • Agarbatti Boxes • Food Packaging • Duplex Mono-Cartons</text>

  <!-- Stamp Badges -->
  <rect x="100" y="505" width="220" height="44" rx="8" fill="#25211D" stroke="#A67C52" stroke-width="2" />
  <text x="210" y="534" font-family="monospace" font-size="14" font-weight="bold" fill="#E8A33D" text-anchor="middle">35+ YEARS MASTERY</text>

  <rect x="340" y="505" width="260" height="44" rx="8" fill="#25211D" stroke="#10B981" stroke-width="2" />
  <text x="470" y="534" font-family="monospace" font-size="14" font-weight="bold" fill="#34D399" text-anchor="middle">NEW CORRUGATION PLANT</text>

  <rect x="620" y="505" width="260" height="44" rx="8" fill="#25211D" stroke="#A67C52" stroke-width="2" />
  <text x="750" y="534" font-family="monospace" font-size="14" font-weight="bold" fill="#F5EBDD" text-anchor="middle">PHONE: 9415405306</text>
</svg>

